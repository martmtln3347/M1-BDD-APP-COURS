# Nook Manager — pile complete : PostgreSQL + Redis + application PHP.
#
#   docker compose up -d --build
#
# Aucun fichier .env n'est necessaire pour une premiere execution : les valeurs
# par defaut ci-dessous suffisent pour la DEMONSTRATION (mots de passe factices,
# ports lies a 127.0.0.1 uniquement). Pour autre chose qu'une demo, copier
# .env.example en .env et choisir de vrais mots de passe.
name: nook-manager

services:
  # ---------- Base relationnelle ----------
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nook_manager}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-demo-superuser-a-changer}
      ACNH_APP_PASSWORD: ${ACNH_APP_PASSWORD:-demo-app-a-changer}
      ACNH_ADMIN_PASSWORD: ${ACNH_ADMIN_PASSWORD:-demo-admin-a-changer}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      # Scripts joues UNE fois, par ordre alphabetique, au premier demarrage
      # (volume vide) : schema, vues, securite, donnees, evolutions.
      - ./init-sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h 127.0.0.1 : pendant l'initialisation, Postgres n'ecoute que sur sa
      # socket Unix. Tester le TCP evite de declarer la base prete trop tot.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 40

  # ---------- Base non relationnelle (cle-valeur) ----------
  redis:
    image: redis:7-alpine
    # requirepass : meme sur le reseau interne, aucune commande sans mot de passe.
    # appendonly : persistance AOF, un redemarrage ne perd pas les sessions ni les notifications.
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-demo-redis-a-changer}
      --appendonly yes
      --appendfsync everysec
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD:-demo-redis-a-changer} --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-demo-redis-a-changer}

  # ---------- Application : API PHP + front ----------
  app:
    image: nook-manager-app
    build:
      context: ..
      dockerfile: docker/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment: &env-app
      DB_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-nook_manager}
      ACNH_APP_PASSWORD: ${ACNH_APP_PASSWORD:-demo-app-a-changer}
      ACNH_ADMIN_PASSWORD: ${ACNH_ADMIN_PASSWORD:-demo-admin-a-changer}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-demo-redis-a-changer}
      # dev : pas de serveur mail, l'API renvoie les liens de verification (localhost uniquement).
      APP_ENV: ${APP_ENV:-dev}
      PHP_CLI_SERVER_WORKERS: 4
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"

  # ---------- Peuplement de la base non relationnelle ----------
  # Tache ponctuelle : lit PostgreSQL (une fois ses donnees chargees) et
  # construit les classements dans Redis, puis s'arrete.
  peupler-redis:
    image: nook-manager-app      # meme image que l'application, construite par le service app
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment: *env-app
    command: ["php", "/opt/init-nosql/peupler-redis.php"]
    restart: "no"

  # ---------- Interfaces d'administration (confort de demonstration) ----------
  # Adminer : parcourir PostgreSQL (tables, cles, requetes SQL). Connexion :
  #   http://localhost:8081/?pgsql=db&username=postgres&db=nook_manager
  # puis le mot de passe POSTGRES_PASSWORD (voir README).
  adminer:
    image: adminer:4
    depends_on:
      db:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8081}:8080"

  # RedisInsight : parcourir Redis (cles, types, durees de vie). A la premiere
  # ouverture il demande d'accepter ses conditions, puis "Add Redis database" :
  # host redis, port 6379, mot de passe REDIS_PASSWORD (voir README).
  redisinsight:
    image: redis/redisinsight:2.70
    depends_on:
      redis:
        condition: service_healthy
    environment:
      # Dans Docker, RedisInsight n'a pas de trousseau systeme : cette cle (factice,
      # DEMONSTRATION uniquement) chiffre le mot de passe Redis qu'il enregistre.
      RI_ENCRYPTION_KEY: ${REDISINSIGHT_ENCRYPTION_KEY:-demo-cle-redisinsight-a-changer}
    ports:
      - "127.0.0.1:${REDISINSIGHT_PORT:-5540}:5540"
    volumes:
      - redisinsight-data:/data

volumes:
  db-data:
  redis-data:
  redisinsight-data:
